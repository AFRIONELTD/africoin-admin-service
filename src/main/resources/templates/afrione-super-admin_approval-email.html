<!DOCTYPE html>
<html
  lang="en"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:th="http://www.thymeleaf.org"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta http-equiv="Content-Type" content="text/html charset=UTF-8" />
    <meta name="x-apple-disable-message-reformatting" />
    <title>AfriOne - Superadmin Approval Required</title>
    <style>
      table,
      td,
      div,
      h1,
      p,
      a {
        box-sizing: border-box;
        color: #091c32;
        font-family: "Neue Montreal", "SF UI Text", -apple-system,
          BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu",
          "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6,
      p {
        margin: 0px;
      }

      img {
        object-fit: cover;
      }

      .main-table {
        width: 100%;
        max-width: 656px;
        padding: 40px 32px;
        border: none;
        border-spacing: 0;
        text-align: left;
        background-color: #f5f5f5;
      }

      .contents {
        padding: 50px 46px 60px;
        background-color: #f8f7f3;
      }

      .footer {
        padding-top: 60px;
      }

      .mobile-downloads {
        display: inline-block;
        width: 120px;
        height: 40px;
      }

      .mobile-downloads.playstore {
        width: 135px;
        margin-left: 12px;
      }

      @media (max-width: 499px) {
        .main-table {
          padding: 24px 16px;
        }

        .contents {
          padding: 50px 16px;
        }
      }

      @media (max-width: 399px) {
        .mobile-downloads {
          width: 90px;
        }

        .mobile-downloads.playstore {
          width: 100px;
          margin-left: 8px;
        }
      }
    </style>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      word-spacing: normal;
      background-color: transparent;
      box-sizing: border-box;
      width: 100%;
    "
  >
    <div
      role="article"
      aria-roledescription="email"
      lang="en"
      style="
        text-size-adjust: 100%;
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
        background-color: transparent;
      "
    >
      <table
        role="presentation"
        style="width: 100%; border: none; border-spacing: 0"
      >
        <tr>
          <td align="center" style="padding: 0">
            <!--[if mso]>
											<table role="presentation" align="center" style="width:810px;">
											<tr>
											<td>
											<![endif]-->

            <table role="presentation" class="main-table">
              <!-- Header -->
              <tr>
                <td>
                  <table
                    role="presentation"
                    style="
                      border: none;
                      border-spacing: 0;
                      width: 100%;
                      background-color: #fff;
                      border-radius: 24px;
                    "
                  >
                    <tr>
                      <td align="middle" style="padding: 28px 16px">
                        <img
                          alt="Jaiz Logo"
                          style="
                            width: 197px;
                            height: 46.25px;
                            object-fit: contain;
                            display: block;
                            max-width: 100%;
                          "
                          src="https://africoin-app-asset.s3.eu-west-2.amazonaws.com/africoin-vector-2.png"
                        />
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>

              <!-- Body -->
              <tr>
                <td>
                  <table
                    role="presentation"
                    style="
                      border: none;
                      border-spacing: 0;
                      width: 100%;
                      background-color: #fff;
                      border-radius: 24px;
                      margin-top: 18px;
                      overflow: clip;
                    "
                  >
                    <tr>
                      <td
                        align="middle"
                        style="
                          background: url('https://africoin-app-asset.s3.eu-west-2.amazonaws.com/africoin-template-header.png'),
                            #0b4627;
                          background-size: contain;
                          padding: 34px 16px;
                        "
                      >
                        <h1
                          style="
                            font-size: 22px;
                            font-weight: 800;
                            color: #fff;
                            text-align: center;
                          "
                        >
                          Superadmin Approval Required
                        </h1>
                      </td>
                    </tr>
                    <tr>
                      <td class="contents">
                        <table
                          role="presentation"
                          style="
                            border: none;
                            border-spacing: 0;
                            width: 100%;
                            background: url('https://africoin-app-asset.s3.eu-west-2.amazonaws.com/africoin-watermark.png');
                            background-size: 97%;
                            background-position: top;
                            background-repeat: no-repeat;
                          "
                        >
                          <tr>
                            <td>
                              <p style="font-size: 20px; color: #141414">
                                Hi <span th:text="${superName}"></span>
                              </p>

                              <p
                                style="
                                  margin: 20px 0 20px 0;
                                  line-height: 28px;
                                  font-size: 20px;
                                  color: #141414;
                                "
                              >
                                An order is ready for your approval.
                              </p>
                              <ul
                                style="
                                  margin-top: 0;
                                  font-size: 18px;
                                  font-weight: 400;
                                  list-style-type: none;
                                  padding: 0;
                                "
                              >
                                <li style="margin-bottom: 8px">
                                  Payer: <strong><span th:text="${payerName}"></span></strong>
                                </li>
                                <li style="margin-bottom: 8px">
                                  Amount:
                                  <strong><span th:text="${amount}"></span> <span th:text="${currency}"></span></strong>
                                </li>
                                <li style="margin-bottom: 8px">
                                  Corridor: <strong><span th:text="${currency}"></span></strong>
                                </li>
                                <li style="margin-bottom: 8px">
                                Requested by: <strong><span th:text="${confirmBy}"></span></strong>
                                </li>
                              </ul>

                              <p
                                style="
                                  margin-top: 30px;
                                  line-height: 28px;
                                  font-size: 20px;
                                  font-weight: 400;
                                  color: #141414;
                                "
                              >
                                Please log in to review and approve this order.
                              </p>
                            <div style="display: flex; justify-content: start; margin-top: 20px;">
                                <a th:href="${loginUrl}" style="text-decoration: none;">
                                  <button
                                      style="border-radius: 30px; padding: 14px 30px; color: #ffffff; border: 0px; margin-bottom: 10px; cursor: pointer; background-color: #173D29; letter-spacing: 0.5%;">
                                    Login
                                  </button>
                                </a>
                            </div>

                              <p style="font-size: 18px; margin-top: 22px; color: #515151;">
                                Best Regards<br /><span
                                  style="margin-top: 5px; color: #000"
                                  >The AfriOne Team</span
                                >
                              </p>
                            </td>
                          </tr>

                          <!-- Footer -->
                          <tr>
                            <td class="footer">
                              <table
                                role="presentation"
                                style="
                                  border: none;
                                  border-spacing: 0;
                                  width: 100%;
                                "
                              >
                                <tr>
                                  <td align="middle" style="padding-top: 24px">
                                    <p
                                      style="
                                        text-align: center;
                                        font-size: 16px;
                                      "
                                    >
                                      Follow our Socials
                                    </p>
                                  </td>
                                </tr>

                                <tr>
                                  <td align="middle" style="padding-top: 4px">
                                    <a
                                      style="
                                        display: inline-block;
                                        width: 24px;
                                        height: 24px;
                                      "
                                    >
                                      <img
                                        alt="Follow Jaiz on Facebook"
                                        style="width: 100%; height: 100%"
                                        src="https://jaiz-resources.s3.us-east-2.amazonaws.com/facebook_group1.png"
                                      />
                                    </a>
                                    <a
                                      style="
                                        display: inline-block;
                                        width: 24px;
                                        height: 24px;
                                        margin-left: 8px;
                                      "
                                    >
                                      <img
                                        alt="Follow Jaiz on X"
                                        style="width: 100%; height: 100%"
                                        src="https://jaiz-resources.s3.us-east-2.amazonaws.com/twitter_group1.png"
                                      />
                                    </a>
                                    <a
                                      style="
                                        display: inline-block;
                                        width: 24px;
                                        height: 24px;
                                        margin-left: 8px;
                                      "
                                    >
                                      <img
                                        alt="Follow Jaiz on Instagram"
                                        style="width: 100%; height: 100%"
                                        src="https://jaiz-resources.s3.us-east-2.amazonaws.com/instagram_group1.png"
                                      />
                                    </a>
                                  </td>
                                </tr>

                                <tr>
                                  <td align="middle" style="padding-top: 20px">
                                    <p
                                      style="
                                        text-align: center;
                                        font-size: 16px;
                                        font-weight: 500;
                                      "
                                    >
                                      © 2025 AfriOne. All right reserved
                                    </p>
                                  </td>
                                </tr>
                              </table>
                            </td>
                          </tr>
                        </table>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>

            <!--[if mso]>
                        </td>
                        </tr>
                        </table>
                        <![endif]-->
          </td>
        </tr>
      </table>
    </div>
  </body>
</html>
