<!DOCTYPE html>

    <title>AfriOne - OTP for Order Approval (Superadmin)</title>
    <style>
        table,
        td,
        div,
        h1,
        p,
        a {
            box-sizing: border-box;
            color: #091c32;
            font-family: "Neue Montreal", "SF UI Text", -apple-system,
                BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu",
                "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            margin: 0px;
        }

        img {
            object-fit: cover;
        }

        .main-table {
            width: 100%;
            max-width: 656px;
            padding: 40px 32px;
            border: none;
            border-spacing: 0;
            text-align: left;
            background-color: #f5f5f5;
        }

        .contents {
            padding: 50px 46px 60px;
            background-color: #f8f7f3;
        }

        .footer {
            padding-top: 60px;
        }

        .mobile-downloads {
            display: inline-block;
            width: 120px;
            height: 40px;
        }

        .mobile-downloads.playstore {
            width: 135px;
            margin-left: 12px;
        }

        @media (max-width: 499px) {
            .main-table {
                padding: 24px 16px;
            }

            .contents {
                padding: 50px 16px;
            }
        }

        @media (max-width: 399px) {
            .mobile-downloads {
                width: 90px;
            }

            .mobile-downloads.playstore {
                width: 100px;
                margin-left: 8px;
            }
        }
   @media (max-width: 480px) {
    div[style*="display: flex"] {

    }
    div[style*="background-color: #F3EEE1"] {
